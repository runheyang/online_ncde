data:
  fast_frame_stride: 3

model:
  variant: sf_ode_bev
  feat_dim: 96
  hidden_dim: 96
  encoder_in_channels: 18
  output_mode: absolute
  decoder_init_scale: null
  streamingflow:
    bev_resolution: [200, 200]
    temporal_state_resolution: [100, 100]
    observation_channels: 64
    decoded_bev_channels: 64
    bev_channels: 96
    bev_stride_xy: 1
    adapter_kind: matched_stride1
    adapter_mid_channels: 128
    small_encoder_kind: streamingflow_downsample
    small_encoder_filter_size: 32
    small_decoder_kind: streamingflow_upsample
    small_decoder_filter_size: 32
    bev_to_3d_decoder_kind: matched_no_upsample
    decoder_high_channels: 64
    decoder_mid_channels: 64
    n_spatial_gru: 2
    n_res_layers: 1
    impute: true
    deterministic_impute: true
    use_variable_ode_step: true

train:
  epochs: 20
  gradient_accumulation_steps: 1
  lambda_fast_kl: 0.0

wandb:
  name: ""
