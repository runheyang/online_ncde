# StreamingFlow BEV GRU-ODE baseline 的 Occ3D 配置覆盖层。
# 由 scripts/baselines/train_streamingflow_bev_ode.py 和
# scripts/baselines/eval_streamingflow_bev_ode.py 自动叠加到用户传入的
# 任意 Occ3D base config 上，不需要为每个 fast/slow 组合单独写 yaml。

data:
  # StreamingFlow baseline 主设定固定为 2Hz，13 帧历史按 stride=3 抽成 5 帧。
  fast_frame_stride: 3

model:
  variant: sf_ode_bev
  feat_dim: 96
  hidden_dim: 96
  encoder_in_channels: 18
  output_mode: absolute
  decoder_init_scale: null
  streamingflow:
    bev_resolution: [200, 200]
    temporal_state_resolution: [100, 100]
    observation_channels: 64
    decoded_bev_channels: 64
    bev_channels: 96
    bev_stride_xy: 1
    adapter_kind: matched_stride1
    adapter_mid_channels: 128
    small_encoder_kind: streamingflow_downsample
    small_encoder_filter_size: 32
    small_decoder_kind: streamingflow_upsample
    small_decoder_filter_size: 32
    bev_to_3d_decoder_kind: matched_no_upsample
    decoder_high_channels: 64
    decoder_mid_channels: 64
    n_spatial_gru: 2
    n_res_layers: 1
    impute: true
    deterministic_impute: true
    use_variable_ode_step: true

train:
  epochs: 20
  # batch_size=1 下每 2 个 micro-batch 更新一次，模拟 batch_size=2。
  gradient_accumulation_steps: 2
  # StreamingFlow baseline 输出 absolute logits，不使用 fast residual KL。
  lambda_fast_kl: 0.0

wandb:
  name: ""
