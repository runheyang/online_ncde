# Learned direct fusion baseline 专属覆盖配置。

model:
  learned_direct_fusion:
    input_grid_size: [200, 200, 16]
    latent_grid_size: [100, 100, 16]
    latent_dim: 128
    fusion_inner_dim: 48
    fusion_body_dilations: [1, 3, 5]
    fusion_gn_groups: 8
    decoder_channels: 32
    decoder_init_scale: 1.0e-6
    use_fast_residual: true

train:
  # Rebuttal baseline 固定训练协议。
  epochs: 10
  gradient_accumulation_steps: 2
