# 100×100×16 Neural ODE Δt baseline 专属覆盖配置。

model:
  neural_ode_dt_100:
    input_grid_size: [200, 200, 16]
    latent_grid_size: [100, 100, 16]
    latent_dim: 120
    func_g_inner_dim: 48
    func_g_body_dilations: [1, 3, 5]
    func_g_gn_groups: 8
    decoder_channels: 32
    decoder_init_scale: 1.0e-6
    use_fast_residual: true
    solver_variant: euler

train:
  # Rebuttal baseline 固定训练协议。
  epochs: 10
  gradient_accumulation_steps: 4
