data:
  logits_format: composite
  fast_logits_format: alocc_dense_topk
  slow_logit_format: opus_sparse_full
  info_path: configs/evoocc/canonical_infos_train_full.pkl
  val_info_path: configs/evoocc/canonical_infos_val_full.pkl
  min_history_completeness: 4  # eval scripts may override with 0 via --include-short-history
  fast_frame_stride: 3  # 13 frames -> 5 frames (2Hz)
  ray_sidecar_dir: data/evoocc_ray_sidecar
  fast_logits_root: data/alocc2d_mini_wo_mask
  slow_logit_root: data/logits_opusv2l_full
  alocc_fill_value: -5.0
  alocc_clamp_min: -5.0
  alocc_topk_k: 3
  alocc_max_centering: false
  opus_full_topk_k: 3
  opus_other_fill_value: -5.0
  opus_free_fill_value: 5.0
  gt_root: data/nuscenes/gts
  num_classes: 18
  free_index: 17
  pc_range: [-40.0, -40.0, -1.0, 40.0, 40.0, 5.4]
  voxel_size: [0.4, 0.4, 0.4]
  grid_size: [200, 200, 16]
  gt_mask_key: mask_camera
  timestamp_scale: 1.0e-6

model:
  feat_dim: 32
  hidden_dim: 32
  encoder_in_channels: 18
  use_fast_residual: true  # true: output adds fast logits, initial state = slow - fast0; false: decoder only, initial state = slow
  decoder_init_scale: 1.0e-6
  func_g_inner_dim: 24
  func_g_body_dilations: [1, 3, 5]
  func_g_gn_groups: 8

loss:
  gamma: 2.0
  lambda_focal: 1.0
  lambda_lovasz: 1.0
  focal_mask_weight: 5.0  # in-mask focal weight; out-of-mask is 1.0
  class_weights: [125, 50, 100, 75, 50, 100, 125, 75, 125, 50, 50, 10, 50, 10, 10, 20, 10, 3]
  ray:
    lambda_ray: 0.2
    lambda_hit: 0.3
    num_samples: 50  # ray samples; num_samples * step_m = max detect range
    step_m: 0.4
    window_voxels: 1  # hit window half-width in step_m units
    near_max_m: 10.0
    mid_max_m: 20.0  # rays with gt_dist >= this are dropped (matches RayIoU)
    near_weight: 2.0
    mid_weight: 1.0
    gt_dist_bias_m: null  # null -> 0.5 * step_m (DVR exit distance to voxel-center offset)

train:
  batch_size: 1
  num_workers: 12
  epochs: 20
  lr: 1.0e-4
  warmup_epochs: 1
  warmup_start_lr: 1.0e-5
  weight_decay: 1.0e-2
  clip_norm: 5.0
  log_interval: 1000
  device: cuda
  supervision_labels: ["t-1.5", "t-1.0", "t-0.5", "t"]
  supervision_weights: [0.15, 0.20, 0.25, 0.40]
  supervision_weight_normalize: true
  ema:
    enabled: true
    decay: 0.999
  lambda_fast_kl: 3.0  # L_kl = lambda * mean(m_occ.clamp(min=0) * KL(aligned || fast.detach()))

dataloader:
  pin_memory: true
  prefetch_factor: 2
  persistent_workers: false

eval:
  batch_size: 1
  num_workers: 16
  device: cuda
  free_conf_thresh: null
  log_interval: 500
  log_multistep_losses: true
  sweep_pkl: data/nuscenes/nuscenes_infos_val_sweep.pkl

wandb:
  entity: runheyang
  project: neural-ode
  name: ""
